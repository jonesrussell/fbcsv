version: '3'

vars:
  BINARY_NAME: csv-search
  BACKEND_PORT: 8080
  FRONTEND_PORT: 3000
  CSV_FILE: data.csv

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  dev:
    desc: "Start development servers"
    cmds:
      - task: backend-dev
      - task: frontend-dev

  backend-dev:
    desc: "Start Go backend development server"
    cmds:
      - go run cmd/server/main.go -csv=data.csv -port=8080

  frontend-dev:
    desc: "Start Vite frontend development server"
    dir: web
    cmds:
      - npm run dev

  build:
    desc: "Build the entire application"
    cmds:
      - mkdir -p bin
      - go build -o bin/csv-search cmd/server/main.go

  test:
    desc: "Run tests"
    cmds:
      - go test -v ./...
